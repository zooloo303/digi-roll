name: tests

on:
  push:
    branches: [main]
  pull_request:

# A PR only needs its latest push checked.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # vitest is the only dependency; the runtime stays zero-dependency, so
      # there is nothing to build and nothing to serve.
      - run: npm ci

      - run: npm test
