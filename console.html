<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>digi-roll — device console</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="console.css">
</head>
<body>
  <header>
    <h1>digi-roll <span class="sub">device console</span></h1>
    <div class="toolbar">
      <select id="port" title="Elektron device (needs both its input and output port)"></select>
      <button id="connect" title="Ask the device to identify itself">Connect</button>
      <button id="backup" title="Fetch the whole current project over SysEx and download it as a file" disabled>Backup project</button>
      <span id="deviceInfo" class="field"></span>
      <a href="index.html" class="backlink">← piano roll</a>
    </div>
    <div id="status"></div>
  </header>

  <div id="importBar">
    <span class="dim">Import from box</span>
    <select id="impPattern" title="Pattern slot on the box (current project)"></select>
    <button id="impFetch" title="Fetch this pattern from the connected device" disabled>Fetch</button>
    <button id="impFile" title="Or decode a saved .syx backup / pattern dump instead">Open .syx…</button>
    <input id="impFileInput" type="file" accept=".syx" hidden>
    <span id="impPatternInfo" class="field"></span>
    <select id="impTrack" title="Which track's trigs to import" disabled></select>
    <span class="dim">→</span>
    <select id="impSlot" title="Piano-roll pattern slot to import into"></select>
    <button id="impGo" title="Replace that piano-roll slot with this track's trigs" disabled>Import to piano roll</button>
  </div>

  <div id="writeBar">
    <span class="dim">Write to box</span>
    <select id="wrSlot" title="Piano-roll pattern to write"></select>
    <span class="dim">→</span>
    <select id="wrPattern" title="Pattern slot on the box (current project)"></select>
    <select id="wrTrack" title="Which track's trigs to replace"></select>
    <button id="wrGo" title="Backs up the target pattern, replaces that track's trigs, then reads back and verifies" disabled>Write to pattern…</button>
    <button id="wrRestore" title="Send the pre-write backup of the last written pattern back to the box" disabled>Restore backup</button>
    <span id="wrInfo" class="field"></span>
  </div>

  <div id="consoleWrap">
    <div class="logbar">
      <span class="dim">SysEx log — every byte in and out</span>
      <label class="field"><input id="autoscroll" type="checkbox" checked> Follow</label>
      <button id="clearLog">Clear</button>
    </div>
    <div id="log"></div>
  </div>

<script type="module" src="js/labs/console.js"></script>
</body>
</html>
